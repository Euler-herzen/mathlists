        function renderGrid(containerId, data, cardType) {
            const container = document.getElementById(containerId);
            if (data.length === 0) {

            } else {
                if (cardType === 'ws') container.innerHTML = data.map(createWSCard).join('');

                if (cardType === 'map') container.innerHTML = data.map(createMapCard).join('');
            }
        }

        function showSubject(subjectId, btnElement) {
            document.querySelectorAll('.subject-section').forEach(el => el.classList.remove('active-subject'));

            document.querySelectorAll('.sub-menu').forEach(el => el.classList.remove('open'));
            document.getElementById('menu-' + subjectId).classList.add('open');

            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            btnElement.classList.add('active');
            
            const firstSubItem = document.querySelector(`#menu-${subjectId} .sub-nav-item`);
            if(firstSubItem) firstSubItem.click();

            window.scrollTo(0,0);
        }

        function showSubContent(subjectId, type, btnElement) {
            document.getElementById(subjectId).querySelectorAll('.sub-content').forEach(el => el.classList.remove('active-sub-content'));

            document.querySelectorAll(`#menu-${subjectId} .sub-nav-item`).forEach(el => el.classList.remove('active'));
