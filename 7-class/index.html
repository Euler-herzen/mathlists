        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

        /* Меню слева */
        .sidebar { width: 260px; background: white; padding: 20px; box-shadow: 2px 0 10px rgba(0,0,0,0.05); position: fixed; height: 100vh; overflow-y: auto; }
        .back-link { display: block; margin-bottom: 20px; color: #888; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: var(--primary); }
        .nav-item { display: block; padding: 12px 15px; color: var(--text); text-decoration: none; border-radius: 8px; margin-bottom: 5px; cursor: pointer; font-weight: 600; transition: 0.2s;}
        .nav-item:hover { background: #f0f4f8; }
        .nav-item.active { background: #eef2f5; color: var(--primary); border-left: 4px solid var(--primary); }

        /* Контент */
        .main-content { margin-left: 260px; padding: 40px; width: calc(100% - 260px); max-width: 1200px; }
        .subject-section { display: none; }
        .subject-section.active-subject { display: block; }
        .section-header { margin-bottom: 30px; border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
        .section-header h2 { font-size: 28px; }
        
        /* Подразделы */
        .sub-category { margin-bottom: 40px; }
        .sub-category h3 { font-size: 20px; margin-bottom: 20px; color: #444; }

        /* Сетка и карточки */
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; transition: transform 0.2s;}
        .card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
        
        /* Цветовые маркеры */
        .card-ws { border-top: 5px solid var(--primary); }
        .card-test { border-top: 5px solid var(--orange); }
        .card-map { border-top: 5px solid var(--purple); }

        .card-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
        .card-desc { font-size: 13px; color: #666; margin-bottom: 15px; flex-grow: 1; }

        /* Кнопки */
        .btn-group { display: flex; gap: 5px; margin-top: auto; }
        .btn-level { flex: 1; padding: 10px 5px; border-radius: 6px; font-size: 13px; font-weight: 600; color: white; text-align: center; text-decoration: none; transition: 0.2s; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer;}
        
        .btn-a { background: var(--level-a); }
        .btn-b { background: var(--level-b); }
        .btn-c { background: var(--level-c); }
        .btn-map { background: var(--purple); width: 100%;}
        
        .btn-base { background: var(--base-color); }
        .btn-adv { background: var(--adv-color); }

        .empty-state { text-align: center; padding: 30px; background: #f9f9f9; border-radius: 12px; border: 2px dashed #ccc; color: #888; grid-column: 1 / -1;}

        @media (max-width: 1100px) { .grid-container { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; }
            .main-content { margin-left: 0; width: 100%; padding: 20px; }
            .grid-container { grid-template-columns: 1fr; }

        // Запуск при загрузке
        renderData();

        // Переключение предметов
        function showSubject(subjectId, btnElement) {
            document.querySelectorAll('.subject-section').forEach(el => el.classList.remove('active-subject'));
            document.getElementById(subjectId).classList.add('active-subject');
            
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            btnElement.classList.add('active');
            window.scrollTo(0,0);
        }
    </script>
</body>
</html>
